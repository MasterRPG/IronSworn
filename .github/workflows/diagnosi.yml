name: Diagnosi schede
on:
  push:
    branches: [diagnosi]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Conta le schede
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB" -c "select id, data->>'nome' as nome, data->>'giocatore' as giocatore, owner is not null as ha_proprietario, data->>'archiviato' as archiviato, jsonb_array_length(coalesce(data->'asset','[]')) as asset, jsonb_array_length(coalesce(data->'legami','[]')) as legami, length(data::text) as dimensione, created_at from public.characters order by id"
          psql "$DB" -c "select nome from public._migrazioni order by 1"
          psql "$DB" -c "select count(*) as utenti from auth.users"
